function tone(f1,f2,dur,type='square',vol=0.08,delay=0){
  if(!AC||muted) return; const t0=AC.currentTime+delay, o=AC.createOscillator(), v=AC.createGain();

}
function noise(dur,vol=0.12,freq=900){ if(!AC||muted) return; const n=Math.floor(AC.sampleRate*dur), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); const s=AC.createBufferSource(), v=AC.createGain(), f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq; s.buffer=b; v.gain.value=vol; s.connect(f).connect(v).connect(AC.destination); s.start(); }

  if(!f) return; const o=AC.createOscillator(), v=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0);

  const tn=TUNES[music.name]; if(!tn||!AC) return;
  const sixteenth=60/tn.bpm/4, loopDur=tn.L.len*sixteenth;
  while(music.next<AC.currentTime+0.25){
    const loopStart=music.next;
    for(const n of tn.L.notes){ const t0=loopStart+n.at*sixteenth, d=n.len*sixteenth*0.92; playNote(n.f,t0,d,tn.wave||'square',0.04); if(tn.echo) playNote(n.f,t0+sixteenth*1.5,d,'triangle',0.016); }

  g.drawImage(ALIEN,120,PH-62+Math.round(Math.sin(t*0.08)),32,30);
  post.push(()=>{ txt('ALIEN IN THE',VW/2,8,13,'#FFE14D','center'); txt('BACKYARD!',VW/2,26,13,'#8EE8F5','center'); txt('HELP GEORGE FIND HIS SHIP PIECES',VW/2,46,6,'#fff','center'); });
  const cw=58, ch=64, gap=12, x0=(VW-cw*2-gap)/2;
  [['kellan','KELLAN'],['diana','DIANA']].forEach(([k,nm],i)=>{ const x=x0+i*(cw+gap), y=58, on=heroKey===k; rect('#000',x-2,y-2,cw+4,ch+4); rect(on?'#FFE14D':'#FFF6DC',x,y,cw,ch); hot.push({x,y,w:cw,h:ch,fn:()=>setHero(k)});
    g.drawImage(HEROES[k].frames.idle.r,0,0,16,24,x+cw/2-16,y+3+(on?Math.round(Math.sin(t*0.15)*2):0),32,48); post.push(()=>txt(nm,x+cw/2,y+ch-11,7,'#3A2A5A','center',false)); });
  const can=saveData.game&&!saveData.game.done;
  btn((VW-130)/2,128,130,22,'NEW GAME',()=>startIntro(),false,'#8EE08E');
  if(can) btn((VW-130)/2,154,130,18,'CONTINUE',()=>{ if(loadGame()){ state='play'; camX=clamp(P.x-VW/2,0,WW-VW); camY=clamp(P.y-PH/2,0,WH-PH); banner={t:'WELCOME BACK! KEEP SEARCHING!',until:t+240}; } },false,'#FFE9A8');
  if(!coarse) post.push(()=>txt('ARROWS + SPACE',VW/2,PH+4,5,'#fff','center'));
  blitFlush();
}
function drawEnding(){
  for(let i=0;i<8;i++) rect(['#05081A','#0B1030','#101A44','#1A2B66','#1A2B66','#101A44','#0B1030','#05081A'][i],0,i*VH/8,VW,VH/8+1);
  const R=seeded(9); for(let i=0;i<90;i++){ rect(((t>>3)+i)%5?'#fff':'#9cf',R()*VW,R()*VH,1,1); }
  const px=VW/2-30+Math.sin(t*0.03)*20, py=70+Math.sin(t*0.05)*5; drawShipPlain(px,py);
  post.push(()=>{ txt('THE END',VW/2,110,16,'#FFE14D','center'); txt('GEORGE IS HEADING HOME!',VW/2,134,7,'#8EE8F5','center'); txt('THANK YOU, '+names().A+' AND '+names().B+'!',VW/2,148,6,'#fff','center'); txt('AND BERNIE!',VW/2,158,6,'#fff','center'); if(endT>120&&((t>>4)&1)) txt(coarse?'TAP TO PLAY AGAIN':'PRESS SPACE',VW/2,176,7,'#fff','center'); });
  blitFlush();
}
function drawShipPlain(x,y){ drawShip(x+0,y+0,0,0,'repaired',0); g.globalAlpha=0.6; g.fillStyle='#FFB347'; g.fillRect(x-6,y+16,12,10+((t>>1)&3)*3); g.globalAlpha=1; }
function draw(){
  hot.length=0; post.length=0; g.imageSmoothingEnabled=false;
  const ox=Math.round(camX), oy=Math.round(camY);
  switch(state){
    case 'title': drawTitle(); return;
    case 'ending': drawEnding(); return;
    case 'intro': {
      drawWorldScene(ox,oy);
      if(iT<118){ // ship falls from the sky
        const k=iT/118, sx=SHIP.x+300*(1-k)-ox, sy=SHIP.y-480*(1-k)*(1-k*0.2)-oy; g.save(); g.translate(sx,sy); g.fillStyle='#FFB347'; for(let i=0;i<8;i++){ g.globalAlpha=0.5-i*0.05; g.fillRect(14+i*9,-40-i*14,10-i,10); } g.globalAlpha=1; g.restore(); drawShip(SHIP.x+300*(1-k),SHIP.y-480*(1-k)*(1-k*0.2),ox,oy,'crashed',0);
      }
      g.fillStyle=`rgba(5,8,26,${Math.max(0,0.7*(1-iT/110))})`; g.fillRect(0,0,VW,PH);
      post.push(()=>{ if(iT<110&&iT>10) txt('WHAT IS THAT NOISE?',VW/2,20,8,'#fff','center'); });
      break; }
    default:
      drawWorldScene(ox,oy);
  }
  if(state==='found') drawFound(); if(state==='finale') { if(finT>300&&finT<330) {} }
  drawHUD(); overlayMsgs(); if(state==='talk') drawDialog();
  if(state==='pause'){ g.fillStyle='rgba(10,16,40,.65)'; g.fillRect(0,0,VW,VH); post.push(()=>txt('PAUSED',VW/2,50,14,'#FFE14D','center')); btn((VW-130)/2,86,130,20,'CONTINUE',()=>{ state='play'; },false,'#8EE08E'); btn((VW-130)/2,112,130,20,'TITLE',()=>{ state='title'; },false); }
  if(state==='play'||state==='talk'||state==='found') { hot.push({x:VW-60,y:0,w:60,h:0,fn:()=>{}}); }
  blitFlush();
}

/* ---------------- sizing and loop ---------------- */
function resize(){
  const app=document.getElementById('app'), r=app.getBoundingClientRect();
  const aspect=r.width/Math.max(1,r.height);
  VW=clamp(Math.round(VH*aspect/2)*2,320,448);
  lo.width=VW; lo.height=VH; g=lo.getContext('2d'); g.imageSmoothingEnabled=false;
  let cw=r.width, ch=cw*VH/VW; if(ch>r.height){ ch=r.height; cw=ch*VW/VH; }
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  document.documentElement.style.setProperty('--hud',(innerHeight-(r.top+(r.height+ch)/2)+ch*(VH-PH)/VH)+'px');
  const dpr=Math.min(3,window.devicePixelRatio||1); cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); SC=cv.height/VH;
  camX=clamp(camX,0,Math.max(0,WW-VW));
}
bakeWorld();
addEventListener('resize',resize); resize();
if(document.fonts&&document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(()=>{});
let acc=0, last=performance.now();
function frame(now){
  acc+=Math.min(100,now-last); last=now;
  try{ if(window.__AEmanual) acc=0; else while(acc>=1000/60){ step(); acc-=1000/60; } }catch(err){ acc=0; hit.clear(); console.error(err); }
  try{ draw(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(state==='play') state='pause'; setMusic(null); try{ speechSynthesis.cancel(); }catch(e){} } });
// test hook for automated play-testing (harmless in normal play)
window.__AE={get state(){return state;}, set state(v){state=v;}, P, finds, solids, GEORGE, SHIP, WW, WH, ROUTE, down, hit, step, draw, canStand, newGame, startIntro, startPlay, doSearch, nearestFind, get found(){return found;}, allFound, zoneOf, get dlg(){return dlg;}, get finT(){return finT;}, get camX(){return camX;}, get camY(){return camY;}, get VW(){return VW;}, ALIEN, HEROES, SL, drawShip, get seen(){return seen;}, get hot(){return hot;}, setTap:(x,y)=>{tapX=x;tapY=y;hit.add('tap');}, loadGame, saveGame, get saved(){return saveData.game;}};
requestAnimationFrame(frame);
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
